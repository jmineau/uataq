repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      # Run the linter
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter
      - id: ruff-format

  - repo: local
    hooks:
      # Run through uv so pyright sees the project environment, and over the
      # same paths as the Code Quality workflow. The upstream pyright hook runs
      # in its own venv without the dependencies installed, so every third-party
      # import came back unresolved, and it checked tests/ which CI does not.
      - id: pyright
        name: pyright (src/uataq)
        entry: uv run pyright src/uataq
        language: system
        types: [ python ]
        pass_filenames: false
