<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>UATAQ — Utah Atmospheric Trace gas &amp; Air Quality</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e31"/>
      <stop offset="1" stop-color="#121314"/>
    </linearGradient>
    <linearGradient id="u" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#e8f1f6"/>
      <stop offset="1" stop-color="#c3cbcf"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- wind streamline behind the U -->
  <path d="M28,178 C120,140 190,205 270,172 S420,120 486,150" fill="none"
        stroke="#708E99" stroke-width="9" stroke-linecap="round" opacity="0.55"/>

  <!-- U whose arms rise into peaks (valley / basin) -->
  <path d="M124,152 L142,124 L151,134 L168,92 L186,126 L200,148 L200,292 A56,56 0 0 0 312,292 L312,146 L330,112 L339,122 L354,92 L374,132 L388,152 L388,292 A132,132 0 0 1 124,292 Z"
        fill="url(#u)"/>
  <!-- snow-line accents on peaks -->
  <path d="M168,92 L186,126 L200,148 L200,160 L176,128 Z" fill="#708E99" opacity="0.6"/>
  <path d="M354,92 L374,132 L388,152 L388,164 L362,126 Z" fill="#708E99" opacity="0.6"/>

  <!-- wind streamlines in front -->
  <path d="M30,262 C110,226 170,300 256,258 S396,206 482,236" fill="none"
        stroke="#9fb4bd" stroke-width="12" stroke-linecap="round"/>
  <path d="M60,340 C140,312 210,372 300,336 S420,300 470,318" fill="none"
        stroke="#9fb4bd" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- CO2 molecule riding the wind (upper right) -->
  <g transform="translate(440,176) rotate(-18)">
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#c5cdd1" stroke-width="5"/>
    <circle cx="-26" cy="0" r="12" fill="#BE0000"/>
    <circle cx="0" cy="0" r="14" fill="#4a4f53" stroke="#c5cdd1" stroke-width="3"/>
    <circle cx="26" cy="0" r="12" fill="#BE0000"/>
  </g>

  <!-- CH4 molecule (left) -->
  <g transform="translate(78,214) rotate(12)">
    <g stroke="#c5cdd1" stroke-width="4">
      <line x1="0" y1="0" x2="0" y2="-22"/>
      <line x1="0" y1="0" x2="20" y2="11"/>
      <line x1="0" y1="0" x2="-20" y2="11"/>
      <line x1="0" y1="0" x2="0" y2="20"/>
    </g>
    <circle cx="0" cy="-22" r="7" fill="#f4f7f9"/>
    <circle cx="20" cy="11" r="7" fill="#f4f7f9"/>
    <circle cx="-20" cy="11" r="7" fill="#f4f7f9"/>
    <circle cx="0" cy="20" r="7" fill="#f4f7f9"/>
    <circle cx="0" cy="0" r="12" fill="#4a4f53" stroke="#c5cdd1" stroke-width="3"/>
  </g>

  <!-- small particle / aerosol dots along the flow -->
  <circle cx="256" cy="214" r="7" fill="#FFB81D"/>
  <circle cx="232" cy="226" r="4.5" fill="#FFB81D" opacity="0.8"/>
  <circle cx="440" cy="290" r="6" fill="#FFB81D"/>
  <circle cx="110" cy="380" r="5" fill="#FFB81D" opacity="0.85"/>

  <!-- O3 molecule (lower right) -->
  <g transform="translate(388,370) rotate(-10)">
    <polyline points="-22,8 0,-8 22,8" fill="none" stroke="#c5cdd1" stroke-width="4"/>
    <circle cx="-22" cy="8" r="10" fill="#BE0000"/>
    <circle cx="0" cy="-8" r="10" fill="#BE0000"/>
    <circle cx="22" cy="8" r="10" fill="#BE0000"/>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="54" letter-spacing="10" fill="#e8f1f6">UATAQ</text>
</svg>
